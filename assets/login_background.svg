<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c231a"/>
      <stop offset="100%" stop-color="#061510"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6cd3c"/>
      <stop offset="100%" stop-color="#d9a411"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8534a"/>
      <stop offset="100%" stop-color="#b7241c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1920" fill="url(#bg)"/>

  <!-- faint pitch reference -->
  <circle cx="540" cy="740" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>
  <line x1="60" y1="740" x2="1020" y2="740" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>

  <!-- top left: small yellow card, tilted -->
  <g transform="translate(150,260) rotate(-14)">
    <rect x="-38" y="-54" width="76" height="108" rx="8" fill="url(#yellow)" fill-opacity="0.85"/>
  </g>

  <!-- top right: small red card, tilted -->
  <g transform="translate(930,300) rotate(12)">
    <rect x="-38" y="-54" width="76" height="108" rx="8" fill="url(#red)" fill-opacity="0.85"/>
  </g>

  <!-- top right: small whistle -->
  <g transform="translate(870,190) rotate(-10) scale(0.55)" fill="#ffffff" fill-opacity="0.55">
    <rect x="-90" y="-24" width="140" height="48" rx="24"/>
    <circle cx="80" cy="0" r="34"/>
    <rect x="42" y="-7" width="30" height="14"/>
    <circle cx="80" cy="0" r="15" fill="#0c231a"/>
  </g>

  <!-- top left: linesman flag -->
  <g transform="translate(200,140) rotate(18)" fill="#ffffff" fill-opacity="0.5">
    <rect x="-4" y="-10" width="8" height="120" rx="2"/>
    <path d="M4 -10 L74 6 L4 36 Z"/>
  </g>

  <!-- centered main whistle -->
  <g transform="translate(540,540)" fill="#ffffff" fill-opacity="0.9">
    <rect x="-90" y="-24" width="140" height="48" rx="24"/>
    <circle cx="80" cy="0" r="34"/>
    <rect x="42" y="-7" width="30" height="14"/>
    <circle cx="80" cy="0" r="15" fill="#0c231a"/>
  </g>

  <!-- group name -->
  <text x="540" y="670" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#f4c430" letter-spacing="2">CIRCULO DE ARBITROS</text>
  <text x="540" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#f4c430" letter-spacing="2">DE JARDIN AMERICA</text>
  <rect x="440" y="748" width="200" height="3" fill="#f4c430" fill-opacity="0.7"/>

  <!-- lower left: linesman flag, larger, faded -->
  <g transform="translate(140,1080) rotate(-16)" fill="#ffffff" fill-opacity="0.12">
    <rect x="-5" y="-14" width="10" height="170" rx="3"/>
    <path d="M5 -14 L110 10 L5 52 Z"/>
  </g>

  <!-- lower right: red + yellow cards fanned, faded -->
  <g transform="translate(950,1060) rotate(8)">
    <rect x="-34" y="-48" width="68" height="96" rx="7" fill="url(#red)" fill-opacity="0.22"/>
  </g>
  <g transform="translate(1000,1000) rotate(-6)">
    <rect x="-34" y="-48" width="68" height="96" rx="7" fill="url(#yellow)" fill-opacity="0.22"/>
  </g>

  <!-- lower left: small whistle, faded -->
  <g transform="translate(190,1180) rotate(20) scale(0.5)" fill="#ffffff" fill-opacity="0.14">
    <rect x="-90" y="-24" width="140" height="48" rx="24"/>
    <circle cx="80" cy="0" r="34"/>
    <rect x="42" y="-7" width="30" height="14"/>
  </g>

  <!-- bottom veil so the login form stays legible over the lower decorations -->
  <rect x="0" y="1300" width="1080" height="620" fill="#050f0b" fill-opacity="0.8"/>
</svg>
