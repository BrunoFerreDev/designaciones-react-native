<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a26"/>
      <stop offset="100%" stop-color="#081712"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6cd3c"/>
      <stop offset="100%" stop-color="#d9a411"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- yellow card, behind, tilted left -->
  <g transform="translate(196,270) rotate(-16)">
    <rect x="-58" y="-82" width="116" height="164" rx="14" fill="url(#yellow)"/>
  </g>

  <!-- whistle, centered, on top -->
  <g transform="translate(300,240) rotate(-6)" fill="#ffffff">
    <rect x="-118" y="-32" width="184" height="64" rx="32"/>
    <circle cx="108" cy="0" r="46"/>
    <rect x="58" y="-9" width="42" height="18"/>
    <circle cx="108" cy="0" r="20" fill="#123a26"/>
  </g>
</svg>
